<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The column, and the copy of it that the button makes.

       Two offset sheets is the copy glyph everywhere, which is the point: the
       control is a text column whose only addition is that button.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.
       Both sheets sample the one ramp, so the back sheet is the same light on
       the same object rather than a second colour.

       Drawn for 32px. The back sheet was 0.42 opacity first and simply left at
       24px, on white, which turned the mark into a single card with two bars on
       it; 0.55 is the lowest value where the second sheet still has an edge
       against the page.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="copy-field-ramp" x1="14" y1="82" x2="84" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The copy, behind. -->
  <rect x="12" y="8" width="54" height="54" rx="14" fill="url(#copy-field-ramp)" fill-opacity="0.55"/>

  <!-- The column itself. -->
  <rect x="30" y="28" width="56" height="60" rx="14" fill="url(#copy-field-ramp)"/>
  <rect x="41" y="46" width="34" height="9" rx="4.5" fill="#F8FAFC"/>
  <rect x="41" y="63" width="24" height="9" rx="4.5" fill="#F8FAFC"/>
</svg>
